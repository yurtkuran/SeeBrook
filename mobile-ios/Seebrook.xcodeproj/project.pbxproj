			shellScript = "# Each configuration has its own Firebase project's file, kept out of git (ED-50).\n# Without one the app builds, and sign-in reports that it is not configured.\nsrc=\"$SRCROOT/Config/Firebase/$CONFIGURATION/GoogleService-Info.plist\"\ndst=\"$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/GoogleService-Info.plist\"\nif [ -f \"$src\" ]; then\n  cp \"$src\" \"$dst\"\n  # Google sign-in returns to the app through its reversed client ID as a URL scheme.\n  scheme=$(/usr/libexec/PlistBuddy -c \"Print :REVERSED_CLIENT_ID\" \"$src\" 2>/dev/null || true)\n  info=\"$TARGET_BUILD_DIR/$INFOPLIST_PATH\"\n  /usr/libexec/PlistBuddy -c \"Delete :CFBundleURLTypes\" \"$info\" 2>/dev/null || true\n  if [ -n \"$scheme\" ]; then\n    /usr/libexec/PlistBuddy -c \"Add :CFBundleURLTypes array\" -c \"Add :CFBundleURLTypes:0 dict\" -c \"Add :CFBundleURLTypes:0:CFBundleURLSchemes array\" -c \"Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string $scheme\" \"$info\"\n  else\n    echo \"warning: The Firebase configuration has no Google client; download it again after enabling Google sign-in\"\n  fi\nelse\n  rm -f \"$dst\"\n  echo \"warning: No Firebase configuration for $CONFIGURATION (Config/Firebase/$CONFIGURATION/GoogleService-Info.plist)\"\nfi\n";
