# Local development services only. Credentials here are for local use and must never be used elsewhere.
name: seebrook-local

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: seebrook
      POSTGRES_USER: seebrook
      POSTGRES_PASSWORD: seebrook-dev
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seebrook -d seebrook"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Catches every email the app sends locally (ED-36); nothing leaves the machine.
  # Web UI: http://localhost:8025 · SMTP: localhost:1025
  mailpit:
    image: axllent/mailpit:v1.33.0
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  # Private document storage stand-in (S3-compatible, ED-38). Data is lost when the container is removed.
  s3:
    image: adobe/s3mock:5.2.3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: seebrook-dev
    ports:
      - "127.0.0.1:9090:9090"

  # Malware scanner for uploaded PDFs (GA-12, ED-38). Needs ~1.5 GB of memory and about a minute
  # to load its signatures after starting.
  clamav:
    image: clamav/clamav:1.5.4-debian   # multi-architecture; the plain tag is amd64 only
    ports:
      - "127.0.0.1:3310:3310"

volumes:
  pgdata:
